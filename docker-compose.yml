services:

  nginx:
    image: nginx:1.30-alpine
    container_name: mypouch-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./Docker/Nginx/default.conf:/etc/nginx/conf.d/default.conf
      - magento_static:/var/www/html/pub/static
      - magento_media:/var/www/html/pub/media
    depends_on:
      - php
    networks:
      - mypouch

  php:
    build:
      context: ./Docker/PHP
      dockerfile: Dockerfile
    container_name: mypouch-php
    volumes:
      - ./src:/var/www/html
      - magento_var:/var/www/html/var
      - magento_generated:/var/www/html/generated
      - magento_static:/var/www/html/pub/static
      - magento_media:/var/www/html/pub/media
    depends_on:
      - mysql
      - opensearch
      - valkey
      - rabbitmq
    networks:
      - mypouch

  mysql:
    image: mysql:8.4
    command: --log-bin-trust-function-creators=1
    container_name: mypouch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - mypouch

  opensearch:
    image: opensearchproject/opensearch:3
    container_name: mypouch-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT}:9200"
    networks:
      - mypouch

  valkey:
    image: valkey/valkey:9
    container_name: mypouch-valkey
    volumes:
      - valkey_data:/data
    networks:
      - mypouch

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: mypouch-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - mypouch

volumes:
  mysql_data:
  opensearch_data:
  valkey_data:
  rabbitmq_data:
  magento_var:
  magento_generated:
  magento_static:
  magento_media:

networks:
  mypouch:
    driver: bridge